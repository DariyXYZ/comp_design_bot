<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Решения и заявки — переехало</title>
    <!--
      Приложение живёт на Vercel: там серверные роуты личного кабинета, которых
      статический экспорт не поддерживает. А этот адрес остаётся живым в старых
      клавиатурах Telegram: reply-клавиатура обновляется только когда бот
      присылает сообщение с разметкой, поэтому кнопка, полученная месяц назад,
      открывает старую сборку. Начальник так и попал на версию, где профиль
      показывает «Гость».

      Отсюда перенаправление, а не заглушка: любая старая кнопка должна
      приводить в текущее приложение, а не в музей.
    -->
    <meta http-equiv="refresh" content="0; url=https://comp-design-bot-sand.vercel.app/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #17181a;
        color: #f5f5f7;
        font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      a {
        color: #f5f5f7;
      }
    </style>
  </head>
  <body>
    <p>
      Приложение переехало.<br />
      <a href="https://comp-design-bot-sand.vercel.app/">Открыть возможности отдела</a>
    </p>
    <script>
      // Путь и параметры переносим как есть: в адресе кнопки едут имя, ник и
      // код входа (`?c=`), и терять их нельзя — иначе приложение снова не
      // опознает человека.
      (function () {
        var target = "https://comp-design-bot-sand.vercel.app";
        var path = location.pathname.replace(/^\/comp_design_bot/, "");
        location.replace(target + (path || "/") + location.search + location.hash);
      })();
    </script>
  </body>
</html>
