name: Deploy draft Mini App

# Публикует ЧЕРНОВИК Mini App из ветки draft/miniapp-flow на Pages отдельного
# репозитория DariyXYZ/comp_design_bot-draft.
#
# Отдельный репозиторий, а не отдельная папка: Pages отдаёт один сайт на
# репозиторий, и деплой черновика в рабочий репозиторий перезаписал бы боевой
# Mini App, который открывается кнопкой в боте.
on:
  push:
    branches: [draft/miniapp-flow]
    paths:
      - "web/**"
      - ".github/workflows/deploy-draft.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-draft
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Черновик живёт по другому пути, чем прод, — иначе ассеты `_next`
      # запрашиваются по адресу боевого сайта и страница остаётся пустой.
      NEXT_PUBLIC_BASE_PATH: /comp_design_bot-draft
      # Публичные по дизайну (anon-ключ Supabase, read-only по RLS).
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Черновик смотрят глазами, поэтому проверки идут, но не блокируют
      # публикацию: сломанный тест не должен мешать посмотреть экраны.
      - run: npm run typecheck
        continue-on-error: true

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
