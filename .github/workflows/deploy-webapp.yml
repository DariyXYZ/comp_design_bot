name: Deploy Mini App

# Проверяет и публикует Mini App из web/ на GitHub Pages.
# Источником Pages должен быть выбран «GitHub Actions» (Settings → Pages),
# иначе job соберётся, но публикация не применится.
on:
  # Приложение переехало на Vercel: там API-роуты личного кабинета,
  # которых статический экспорт не поддерживает. Автотриггер снят —
  # сборка под Pages больше не проходит. Оставлен ручной запуск,
  # чтобы историю и возможность откатиться не терять.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои Pages конфликтуют между собой; cancel-in-progress:false —
# чтобы уже начатая публикация дособлюдалась, а не обрывалась следующим пушем.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  # Проверки отдельным job'ом: на pull_request он идёт один, без публикации.
  verify:
    # Только рабочий репозиторий: в репозитории черновика ветка main — это
    # черновик, и публиковать его боевым workflow нельзя.
    if: github.repository == 'DariyXYZ/comp_design_bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  build:
    needs: verify
    # На PR только проверяем — публикация идёт с main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Публичные по дизайну (anon-ключ Supabase, read-only по RLS), поэтому
      # переменные репозитория, а не секреты. При output:'export' значения
      # вшиваются в бандл на этапе сборки — без них build падает осознанно.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      # output:'export' кладёт готовую статику в web/out (там же .nojekyll,
      # без него Pages выкинул бы каталог _next как «служебный» для Jekyll).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
